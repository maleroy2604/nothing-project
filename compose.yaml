services:

  frontend:
    build:
      context: .
      dockerfile: containers/frontend/Containerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: containers/api/Containerfile
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8090
      DATABASE_URL: postgresql+asyncpg://appuser@postgres:5432/nothing
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: containers/ai/Containerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.31.16.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

  postgres:
    build:
      context: ./containers/postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: nothing
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
